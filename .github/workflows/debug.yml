name: debug

on:
  workflow_dispatch:
  push:
    branches: ["feat/milestone-events"]

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Create keypair
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase -s -o "$HOME/.config/solana/id.json"

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 1.1.2 --from-source
          avm use 1.1.2

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Build
        run: |
          anchor keys sync
          anchor build

      - name: Show test files
        run: |
          echo "Files under tests:"
          find tests -type f -maxdepth 5 -print
          echo "Glob expansion:"
          printf '%s\n' tests/**/*.ts

      - name: Run exact grader test command
        run: |
          anchor test --skip-build